  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

::before, *::after { box-sizing: border-box; }\n    body { margin:0; background:#F4F6F5; color:#1F2A2E; font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }\n    a { color:#006C35; }\n    a:hover { color:#0A5C31; }\n    input, select, button { font-family:inherit; }\n    :focus-visible { outline:2px solid #006C35; outline-offset:2px; }\n    ::selection { background:#CFE7D9; }\n    .ar { font-family:'Noto Naskh Arabic','IBM Plex Sans',serif; direction:rtl; }\n    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh\">\n  <header style=\"background:#14434E;color:#fff;padding:clamp(20px,4vw,30px) clamp(20px,4vw,32px)\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <a href=\"index.html\" style=\"display:inline-flex;align-items:center;gap:7px;color:#A9C6CE;text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:14px\" style-hover=\"color:#fff\">← Back to the application page<\u002Fa>\n      <p style=\"margin:0 0 5px;font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#8FE3B4\">Program directory<\u002Fp>\n      <h1 style=\"margin:0 0 8px;font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;font-size:clamp(24px,4.4vw,34px);line-height:1.2\">Programs &amp; Courses<\u002Fh1>\n      <p style=\"margin:0;font-size:15px;line-height:1.6;color:#A9C6CE;max-width:66ch\">Programs listed on the official Study in Saudi platform, searchable by university, level, applicant type, funding and language. Compiled by Arabex International — always confirm details on the university's own site before applying.<\u002Fp>\n      <p style=\"margin:14px 0 0;font-size:13.5px;color:#8FE3B4;font-weight:600\">{{ headerCount }}<\u002Fp>\n      <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(169,198,206,.25);display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center\">\n        <p style=\"margin:0;font-size:13px;color:#A9C6CE\">Compiled from the official <a href=\"https://studyinsaudi.sa\" target=\"_blank\" rel=\"noopener\" style=\"color:#8FE3B4;font-weight:600;text-decoration:none;border-bottom:1px solid rgba(143,227,180,.4)\" style-hover=\"color:#fff;border-color:#fff\">Study in Saudi platform<\u002Fa> by Arabex International.<\u002Fp>\n        <p style=\"margin:0;font-size:13px;color:#A9C6CE\">Last updated {{ updated }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,30px) clamp(20px,4vw,32px) 72px\">\n    <section style=\"background:#FFF8EB;border:1px solid #F3C989;border-radius:10px;padding:clamp(18px,3.4vw,26px);margin-bottom:22px\">\n      <p style=\"margin:0 0 8px;font-weight:700;color:#7A5200;font-size:15px\">Programs are being rebuilt on the official platform for the new application window<\u002Fp>\n      <div style=\"font-size:14px;line-height:1.7;color:#5C4200\">\n        <p style=\"margin:0 0 8px\">The official Study in Saudi platform reset all specializations ahead of the new window and is adding them back gradually. Paid (self-funded) and partial-scholarship programs are listed now; fully-funded scholarship programs are expected soon. New universities not on last year's list are also appearing, so it is worth browsing the full official list rather than assuming it matches before.<\u002Fp>\n        <p style=\"margin:0 0 8px\"><strong>The new application window opens 16 September 2026.<\u002Fstrong><\u002Fp>\n        <p style=\"margin:0\">Because of this reset, the directory below no longer reflects the current official listings. Please use the official page for program lists — we will refresh this directory once the platform stabilizes.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"https://studyinsaudi.sa/en/Programs\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#006C35;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;padding:0 18px;min-height:46px;border-radius:6px\" style-hover=\"background:#0A5C31\">Find programs on the official site ↗<\u002Fa>\n    <\u002Fsection>\n    <section style=\"background:#fff;border:1px solid #E1E9E5;border-radius:10px;padding:clamp(18px,3.4vw,26px);box-shadow:0 1px 2px rgba(20,67,78,.05)\">\n      <label for=\"q\" style=\"display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#006C35;margin-bottom:8px\">Search programs<\u002Flabel>\n      <input id=\"q\" type=\"search\" value=\"{{ q }}\" sc-camel-on-input=\"{{ setQ }}\" placeholder=\"Try “computer”, “sharia”, “حاسب”…\" style=\"width:100%;padding:12px 14px;border:1px solid #D5DFDB;border-radius:6px;background-color:#fff;color:#1F2A2E;min-height:50px;font-size:15.5px\">\n\n      <div style=\"margin-top:18px\">\n        <p style=\"margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B6A6E\">University<\u002Fp>\n        <sc-if value=\"{{ uniHasChips }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center\">\n            <sc-for list=\"{{ uniChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px;background:#EDF6F0;border:1px solid #BFDCCB;border-radius:999px;padding:5px 6px 5px 12px;font-size:13.5px;font-weight:600;color:#0A5C31\">\n                {{ c.label }}\n                <button type=\"button\" data-v=\"{{ c.v }}\" sc-camel-on-click=\"{{ uniChipRemove }}\" aria-label=\"Remove\" style=\"width:20px;height:20px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:#D5E9DC;color:#0A5C31;font-size:14px;line-height:1;cursor:pointer\" style-hover=\"background:#006C35;color:#fff\">×<\u002Fbutton>\n              <\u002Fspan>\n            <\u002Fsc-for>\n            <button type=\"button\" sc-camel-on-click=\"{{ uniClearAll }}\" style=\"border:0;background:transparent;color:#5B6A6E;font-size:13px;font-weight:600;cursor:pointer;padding:5px 6px;text-decoration:underline\" style-hover=\"color:#006C35\">Clear<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"position:relative\">\n          <input id=\"uniPick\" type=\"text\" autocomplete=\"off\" role=\"combobox\" aria-expanded=\"{{ uniOpen }}\" aria-controls=\"uniMenu\" value=\"{{ uniQ }}\" sc-camel-on-input=\"{{ uniSetQ }}\" sc-camel-on-focus=\"{{ uniOpenMenu }}\" placeholder=\"{{ uniPlaceholder }}\" style=\"width:100%;padding:11px 34px 11px 13px;border:1px solid #D5DFDB;border-radius:6px;background-color:#fff;color:#1F2A2E;min-height:48px;font-size:15px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ uniOpenMenu }}\" aria-label=\"Open list\" tabindex=\"-1\" style=\"position:absolute;top:50%;right:11px;transform:translateY(-50%);border:0;background:transparent;color:#6C7C80;font-size:13px;line-height:1;cursor:pointer;padding:4px\">▾<\u002Fbutton>\n          <sc-if value=\"{{ uniOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <ul id=\"uniMenu\" role=\"listbox\" style=\"position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;max-height:300px;overflow-y:auto;list-style:none;margin:0;padding:6px;background:#fff;border:1px solid #D5DFDB;border-radius:8px;box-shadow:0 12px 28px rgba(20,67,78,.16)\">\n              <sc-for list=\"{{ uniRows }}\" as=\"u\" hint-placeholder-count=\"8\">\n                <li role=\"option\" aria-selected=\"{{ u.on }}\" data-v=\"{{ u.v }}\" sc-camel-on-mouse-down=\"{{ uniToggle }}\" style=\"display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:5px;font-size:14.5px;color:#1F2A2E;cursor:pointer;background:{{ u.bg }}\" style-hover=\"background:#F0F6F2\">\n                  <span style=\"flex:none;width:17px;height:17px;border:1.5px solid {{ u.markBorder }};background:{{ u.markBg }};border-radius:4px;color:#fff;font-size:11px;line-height:15px;text-align:center\">{{ u.mark }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0\">{{ u.label }} <span style=\"color:#5B6A6E;font-size:13px\">{{ u.city }}<\u002Fspan><\u002Fspan>\n                  <span style=\"flex:none;font-size:12.5px;color:#5B6A6E\">{{ u.n }}<\u002Fspan>\n                <\u002Fli>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ uniNoHits }}\" hint-placeholder-val=\"{{ false }}\">\n                <li style=\"padding:10px;font-size:14px;color:#6C7C80;list-style:none\">No university matches that<\u002Fli>\n              <\u002Fsc-if>\n            <\u002Ful>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:18px;display:grid;gap:14px\">\n        <sc-for list=\"{{ facets }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div>\n            <p style=\"margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B6A6E\">{{ f.title }}<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n              <sc-for list=\"{{ f.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button type=\"button\" data-k=\"{{ o.k }}\" data-v=\"{{ o.v }}\" sc-camel-on-click=\"{{ toggle }}\" aria-pressed=\"{{ o.on }}\" style=\"border:1px solid {{ o.bc }};background:{{ o.bg }};color:{{ o.fg }};font-weight:{{ o.fw }};font-size:14px;padding:0 14px;min-height:40px;border-radius:999px;cursor:pointer;transition:background .16s ease,border-color .16s ease\" style-hover=\"border-color:#006C35\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid #EDF2F0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between\">\n        <p style=\"margin:0;font-size:14.5px;color:#3A4A4E\"><strong style=\"color:#14434E\">{{ count }}<\u002Fstrong> {{ countWord }}<\u002Fp>\n        <sc-if value=\"{{ anyFilter }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"background:#fff;color:#14434E;border:1px solid #C6D4CF;font-size:14px;font-weight:600;padding:0 15px;border-radius:6px;min-height:40px;cursor:pointer\" style-hover=\"border-color:#006C35;color:#006C35\">Clear all filters<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ hasResults }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))\">\n        <sc-for list=\"{{ shown }}\" as=\"p\" hint-placeholder-count=\"9\">\n          <article style=\"display:flex;flex-direction:column;background:#fff;border:1px solid #E1E9E5;border-left:3px solid {{ p.accent }};border-radius:9px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,67,78,.05);animation:fadeUp .28s ease both;transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease\" style-hover=\"transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,67,78,.1)\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px\">\n              <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#14434E;background:#EEF3F2;border-radius:4px;padding:4px 8px\">{{ p.lv }}<\u002Fspan>\n              <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:{{ p.fuFg }};background:{{ p.fuBg }};border-radius:4px;padding:4px 8px\">{{ p.fu }}<\u002Fspan>\n              <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#5B6A6E;background:#F2F5F4;border-radius:4px;padding:4px 8px\">{{ p.ta }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;font-weight:600;line-height:1.35;color:#14434E\">{{ p.en }}<\u002Fp>\n            <p class=\"ar\" style=\"margin:4px 0 0;font-size:15px;line-height:1.6;color:#6C7C80\">{{ p.ar }}<\u002Fp>\n            <a href=\"{{ p.site }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:9px;font-size:13.5px;font-weight:600;text-decoration:none;color:#006C35\" style-hover=\"color:#0A5C31\">{{ p.un }} ↗<\u002Fa>\n            <dl style=\"margin:13px 0 0;padding:12px 0 0;border-top:1px solid #EDF2F0;display:grid;gap:7px\">\n              <sc-for list=\"{{ p.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:10px;justify-content:space-between;font-size:13.5px;line-height:1.45\">\n                  <dt style=\"color:#5B6A6E;flex:none\">{{ r.k }}<\u002Fdt>\n                  <dd style=\"margin:0;color:#3A4A4E;font-weight:500;text-align:right\">{{ r.v }}<\u002Fdd>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdl>\n            <a href=\"{{ p.wa }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#14434E;text-decoration:none;border:1px solid #C6D4CF;font-size:14px;font-weight:600;border-radius:6px;min-height:42px;transition:border-color .2s ease,background .2s ease\" style-hover=\"border-color:#006C35;color:#006C35;background:#F5FAF7\">Ask about this program<\u002Fa>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ canLoadMore }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ more }}\" style=\"margin:20px auto 0;display:block;background:#006C35;color:#fff;border:0;font-size:15.5px;font-weight:600;padding:0 28px;border-radius:6px;min-height:52px;cursor:pointer;box-shadow:0 8px 20px rgba(0,108,53,.22);transition:transform .18s cubic-bezier(.2,.7,.3,1)\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:translateY(0) scale(.99)\">{{ moreLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:16px;background:#fff;border:1px solid #E1E9E5;border-radius:10px;padding:clamp(28px,5vw,44px);text-align:center\">\n        <p style=\"margin:0 0 6px;font-size:17px;font-weight:600;color:#14434E\">No programs match that<\u002Fp>\n        <p style=\"margin:0 0 18px;font-size:14.5px;line-height:1.6;color:#6C7C80\">Try fewer filters, or ask us directly — we can check options that aren't listed here.<\u002Fp>\n        <a href=\"{{ waGeneral }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#006C35;color:#fff;text-decoration:none;border:0;font-size:15px;font-weight:600;padding:0 24px;border-radius:6px;min-height:48px\">Ask Arabex on WhatsApp<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <p style=\"margin:26px 0 0;font-size:13px;line-height:1.65;color:#6C7C80;max-width:80ch\">Program details, fees and durations are compiled from the official <a href=\"https://studyinsaudi.sa\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:600;text-decoration:none;border-bottom:1px solid #BFDCCB\">Study in Saudi platform<\u002Fa> and were last checked on {{ updated }}. Fees and requirements change without notice — confirm every figure with the university or the official platform before you apply or make plans. Arabex International is an independent consultancy: we assist with applications, translation and guidance, and we do not decide admissions or grant scholarships.<\u002Fp>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;917994514263&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;}}\">\nclass Component extends DCLogic {\n  state = { q: \"\", sel: {}, page: 1 };\n\n  static UPDATED = \"6 September 2026\";\n  static PER = 24;\n  static FACETS = [\n    { k: \"un\", title: \"University\" },\n    { k: \"ta\", title: \"Applicant type\" },\n    { k: \"lv\", title: \"Level\" },\n    { k: \"fu\", title: \"Funding\" },\n    { k: \"ln\", title: \"Language of instruction\" },\n    { k: \"g\", title: \"Open to\" }\n  ];\n  static LV_ORDER = [\"Diploma\", \"Bachelor\", \"Higher Diploma\", \"Master\", \"PhD\"];\n\n  componentDidMount() {\n    if (!this.unis().length) {\n      let tries = 0;\n      const poll = () => {\n        if (this.unis().length) { this._flat = null; this.forceUpdate(); return; }\n        if (++tries < 60) setTimeout(poll, 100);\n      };\n      poll();\n    }\n    this._away = (e) => {\n      if (!this.state.uniOpen) return;\n      const box = document.getElementById(\"uniMenu\"), inp = document.getElementById(\"uniPick\");\n      if ((box && box.contains(e.target)) || (inp && inp.contains(e.target))) return;\n      this.setState({ uniOpen: false });\n    };\n    document.addEventListener(\"mousedown\", this._away, true);\n  }\n\n  componentWillUnmount() {\n    if (this._away) document.removeEventListener(\"mousedown\", this._away, true);\n  }\n\n  unis() { return (typeof window !== \"undefined\" && window.PROGRAMS) || []; }\n\n  flat() {\n    if (this._flat) return this._flat;\n    const out = [];\n    for (const u of this.unis())\n      for (const p of (u.programs || []))\n        out.push(Object.assign({}, p, { un: u.uni, site: u.site, city: u.city }));\n    if (out.length) this._flat = out;\n    return out;\n  }\n\n  num() { return this.props.whatsappNumber || \"917994514263\"; }\n\n  renderVals() {\n    const s = this.state;\n    const all = this.flat();\n    const q = s.q.trim().toLowerCase();\n    const sel = s.sel || {};\n\n    const passes = (p, skip) => {\n      if (q && !(p.en + \" \" + p.ar + \" \" + p.cp + \" \" + p.un).toLowerCase().includes(q)) return false;\n      for (const f of Component.FACETS) {\n        if (f.k === skip) continue;\n        const picked = sel[f.k] || [];\n        if (picked.length && picked.indexOf(p[f.k]) < 0) return false;\n      }\n      return true;\n    };\n\n    const results = all.filter(p => passes(p));\n    const shownList = results.slice(0, s.page * Component.PER);\n\n    const fuStyle = (v) =>\n      v === \"Full Scholarship\" ? { fuBg: \"#EDF6F0\", fuFg: \"#0A5C31\", accent: \"#006C35\" }\n      : v === \"Partial Scholarship\" ? { fuBg: \"#FFF6E8\", fuFg: \"#8A5A0B\", accent: \"#C98A16\" }\n      : { fuBg: \"#F2F5F4\", fuFg: \"#5B6A6E\", accent: \"#9AA8A4\" };\n\n    const rowsFor = (p) => [\n      { k: \"Duration\", v: p.du },\n      { k: \"Campus\", v: p.cp },\n      { k: \"Language\", v: p.ln },\n      { k: \"Cost\", v: p.co },\n      { k: \"Open to\", v: p.g === \"Both\" ? \"Men and women\" : p.g }\n    ].filter(r => r.v);\n\n    const sortFor = (k, arr) => {\n      if (k === \"lv\") return arr.slice().sort((a, b) => Component.LV_ORDER.indexOf(a) - Component.LV_ORDER.indexOf(b));\n      return arr.slice().sort();\n    };\n\n    const anyFilter = !!q || Component.FACETS.some(f => (sel[f.k] || []).length);\n    const nUni = this.unis().length;\n\n    return {\n      updated: Component.UPDATED,\n      headerCount: all.length + \" programs · \" + nUni + (nUni === 1 ? \" university\" : \" universities\") + \" · more added as we compile them\",\n      q: s.q,\n      setQ: (ev) => this.setState({ q: ev.target.value, page: 1 }),\n      facets: Component.FACETS.filter(f => f.k !== \"un\").map(f => {\n        const avail = [...new Set(all.filter(p => passes(p, f.k)).map(p => p[f.k]).filter(Boolean))];\n        const picked = sel[f.k] || [];\n        const opts = sortFor(f.k, [...new Set(avail.concat(picked))]).map(v => {\n          const on = picked.indexOf(v) > -1;\n          return {\n            k: f.k, v, label: v === \"Both\" ? \"Men and women\" : v, on,\n            bg: on ? \"#006C35\" : \"#fff\",\n            bc: on ? \"#006C35\" : \"#D5DFDB\",\n            fg: on ? \"#fff\" : \"#3A4A4E\",\n            fw: on ? \"600\" : \"500\"\n          };\n        });\n        return { title: f.title, opts };\n      }),\n      uniQ: s.uniQ || \"\",\n      uniOpen: !!s.uniOpen,\n      uniSetQ: (ev) => this.setState({ uniQ: ev.target.value, uniOpen: true }),\n      uniOpenMenu: () => this.setState({ uniOpen: true }),\n      uniChips: (sel.un || []).map(v => ({ v, label: v })),\n      uniHasChips: (sel.un || []).length > 0,\n      uniPlaceholder: (sel.un || []).length ? \"Add another university…\" : \"All universities — type to search\",\n      uniRows: (() => {\n        const uq = (s.uniQ || \"\").trim().toLowerCase();\n        const picked = sel.un || [];\n        const counts = {};\n        for (const p of all.filter(p => passes(p, \"un\"))) counts[p.un] = (counts[p.un] || 0) + 1;\n        return this.unis().map(u => u.uni)\n          .filter(n => !uq || (n + \" \" + (this.unis().find(x => x.uni === n) || {}).city).toLowerCase().includes(uq))\n          .sort()\n          .map(n => {\n            const on = picked.indexOf(n) > -1;\n            const city = (this.unis().find(x => x.uni === n) || {}).city || \"\";\n            return { v: n, label: n, city, n: String(counts[n] || 0), on,\n              bg: on ? \"#EDF6F0\" : \"#fff\",\n              mark: on ? \"✓\" : \"\",\n              markBg: on ? \"#006C35\" : \"#fff\",\n              markBorder: on ? \"#006C35\" : \"#C6D4CF\" };\n          });\n      })(),\n      uniNoHits: (() => {\n        const uq = (s.uniQ || \"\").trim().toLowerCase();\n        if (!uq) return false;\n        return !this.unis().some(u => (u.uni + \" \" + u.city).toLowerCase().includes(uq));\n      })(),\n      uniToggle: (ev) => {\n        const v = ev.currentTarget.getAttribute(\"data-v\");\n        this.setState(st => {\n          const cur = (st.sel.un || []).slice();\n          const i = cur.indexOf(v);\n          if (i > -1) cur.splice(i, 1); else cur.push(v);\n          return { sel: Object.assign({}, st.sel, { un: cur }), page: 1, uniQ: \"\" };\n        });\n      },\n      uniChipRemove: (ev) => {\n        const v = ev.currentTarget.getAttribute(\"data-v\");\n        this.setState(st => ({ sel: Object.assign({}, st.sel, { un: (st.sel.un || []).filter(x => x !== v) }), page: 1 }));\n      },\n      uniClearAll: () => this.setState(st => ({ sel: Object.assign({}, st.sel, { un: [] }), page: 1, uniQ: \"\", uniOpen: false })),\n      toggle: (ev) => {\n        const k = ev.currentTarget.getAttribute(\"data-k\");\n        const v = ev.currentTarget.getAttribute(\"data-v\");\n        this.setState(st => {\n          const cur = (st.sel[k] || []).slice();\n          const i = cur.indexOf(v);\n          if (i > -1) cur.splice(i, 1); else cur.push(v);\n          return { sel: Object.assign({}, st.sel, { [k]: cur }), page: 1 };\n        });\n      },\n      reset: () => this.setState({ q: \"\", sel: {}, page: 1, uniQ: \"\", uniOpen: false }),\n      anyFilter,\n      count: String(results.length),\n      countWord: results.length === 1 ? \"program\" : \"programs\",\n      hasResults: results.length > 0,\n      noResults: results.length === 0,\n      shown: shownList.map(p => Object.assign({\n        en: p.en, ar: p.ar, lv: p.lv, fu: p.fu, ta: p.ta, un: p.un, site: p.site,\n        rows: rowsFor(p),\n        wa: \"https://wa.me/\" + this.num() + \"?text=\" + encodeURIComponent(\n          \"Hello Arabex International, I would like to know more about this program:\\n\\n\" +\n          p.en + \"\\n\" + p.un + \" — \" + p.cp + \"\\n\" + p.lv + \" · \" + p.du + \" · \" + p.ln + \" · \" + p.fu\n        )\n      }, fuStyle(p.fu))),\n      canLoadMore: shownList.length < results.length,\n      moreLabel: \"Show more (\" + (results.length - shownList.length) + \" left)\",\n      more: () => this.setState(st => ({ page: st.page + 1 })),\n      waGeneral: \"https://wa.me/\" + this.num() + \"?text=\" + encodeURIComponent(\"Hello Arabex International, I am looking for a program that isn't listed. Can you help?\")\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
